#speak-flow-study .sp-reading-heading { margin:0 0 10px; font:26px/1.1 Georgia,'Times New Roman',serif; letter-spacing:-.04em; }

#speak-flow-study .sp-primary { border-radius:8px; }

#speak-flow-study .sp-overlay-space { width:206px; min-height:46px; height:46px; padding:0; margin:14px auto 8px; background:light-dark(#1A1A1A,#10100F); color:#FCFCFB; border:1px solid light-dark(#1A1A1A,#55524A); border-radius:999px; box-shadow:0 5px 16px var(--sp-shadow); transition:width 220ms cubic-bezier(.2,.8,.2,1); }

</style>
<div class="sp-stage">
  <div class="sp-label"><span>Speak · Paper &amp; Ink</span><span>Flow-inspired study</span></div>
  <section class="sp-window" aria-label="Speak app">
    <header class="sp-bar"><div class="sp-lights" aria-hidden="true"><span></span><span></span><span></span></div><div class="sp-brand"><i data-lucide="audio-lines" aria-hidden="true"></i>Speak</div><button class="sp-icon" id="sp-settings-button" aria-label="Open settings" aria-expanded="false"><i data-lucide="settings-2" aria-hidden="true"></i></button></header>
    <div class="sp-body" id="sp-reader">
      <h2 class="sp-reading-heading">Make room to listen.</h2>
      <textarea id="sp-text" aria-label="Text to read">A quieter way to work.

Read a thought aloud, or speak the next one into place.</textarea>
      <div class="sp-meta"><span>On your Mac</span><span>Heart · English</span></div>
      <div class="sp-player" aria-label="Playback controls"><div class="sp-row">
        <button class="sp-primary" id="sp-play"><span id="sp-play-label">Listen</span></button>
        <div class="sp-timeline"><div class="sp-track"><div id="sp-progress"></div></div><div class="sp-time"><span id="sp-time">0:00</span><span id="sp-play-state">Ready</span></div></div>
        <button class="sp-icon" id="sp-stop" aria-label="Stop playback" disabled><i data-lucide="square" aria-hidden="true"></i></button>
      </div><div class="sp-speed"><label for="sp-rate">Speed</label><input id="sp-rate" type="range" min="0.5" max="2" step="0.1" value="1" aria-valuetext="1 times speed"><output id="sp-rate-value" for="sp-rate">1.0×</output></div></div>
    </div>
    <section class="sp-body" id="sp-settings" hidden aria-label="Settings">
      <div class="sp-settings-title"><button class="sp-icon" id="sp-back" aria-label="Back to reader"><i data-lucide="chevron-left" aria-hidden="true"></i></button><h2>Settings</h2></div>
      <div class="sp-setting"><label for="sp-shortcut">Dictation shortcut<small>Press once to start, again to finish</small></label><select id="sp-shortcut"><option value="ctrl-alt-space">⌃ ⌥ Space</option><option value="ctrl-shift-space">⌃ ⇧ Space</option></select></div>
      <div class="sp-setting"><label for="sp-format">Formatting<small>Preserve your wording</small></label><select id="sp-format"><option value="plain">Plain</option><option value="lists">Spoken lists</option></select></div>
      <div class="sp-setting"><label for="sp-remember">Remember reading speed</label><input id="sp-remember" type="checkbox" checked></div>
      <div class="sp-setting"><label for="sp-appearance">Appearance</label><select id="sp-appearance"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></div>
      <div class="sp-setting"><span>Voice</span><span>Heart · English</span></div>
    </section>
  </section>
  <section class="sp-context" aria-label="Shortcut dictation in another app">
    <div class="sp-label"><span>Dictation · app stays closed</span><span id="sp-key-label">⌃ ⌥ Space</span></div>
    <div class="sp-target"><div class="sp-target-head"><strong>Your document</strong><span>Example text field</span></div><textarea id="sp-target" aria-label="Example insertion target" placeholder="Your words appear here."></textarea></div>
    <div class="sp-overlay-space">
      <button class="sp-trigger" id="sp-trigger"><i data-lucide="mic" aria-hidden="true"></i><span id="sp-trigger-label">Try dictation shortcut</span></button>
      <div class="sp-pill" id="sp-pill" hidden aria-label="Floating dictation control">
        <span class="sp-pill-state" id="sp-pill-state">Listening</span>
        <div class="sp-wave" id="sp-wave" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <time id="sp-record-time">0:00</time>
        <button class="sp-icon" id="sp-finish" aria-label="Finish dictation"><i data-lucide="square" aria-hidden="true"></i></button>
        <button class="sp-icon" id="sp-cancel" aria-label="Cancel dictation"><i data-lucide="x" aria-hidden="true"></i></button>
      </div>
    </div>
  </section>
  <p class="sp-foot">Design preview · audio, waveform and insertion are simulated</p>
  <div class="sp-a11y" id="sp-announcement" role="status" aria-live="polite"></div>
</div>
<script>
(() => {
  const root = document.getElementById('speak-flow-study');
  const el = id => root.querySelector('#' + id);
  const design = {appearance:'system',solid:false,reduceMotion:false};
  const state = {playing:false,position:0,rate:1,appliedRate:1,fromRate:1,rampStart:0,last:0,recording:false,processing:false,recordStart:0,start:0,end:0,original:''};
  let frame = 0, finishTimer = 0, hideTimer = 0;
  const announce = text => { el('sp-announcement').textContent = text; };
  function renderDesign() { root.style.colorScheme = design.appearance === 'system' ? 'light dark' : design.appearance; root.dataset.solid = String(design.solid); root.dataset.motion=design.reduceMotion?'reduce':'normal'; el('sp-appearance').value = design.appearance; }
  function reveal(node) { if(design.reduceMotion || matchMedia('(prefers-reduced-motion: reduce)').matches)return; node.getAnimations().forEach(a=>a.cancel()); node.animate([{opacity:0,transform:'translateY(3px)'},{opacity:1,transform:'translateY(0)'}],{duration:180,easing:'ease-out'}); }
  function rateChange() { state.fromRate = state.appliedRate; state.rate = Number(el('sp-rate').value); state.rampStart = performance.now(); el('sp-rate-value').textContent = state.rate.toFixed(1)+'×'; el('sp-rate').setAttribute('aria-valuetext',state.rate.toFixed(1)+' times speed'); }
  function playback(playing) { state.playing=playing; el('sp-text').readOnly=playing || state.position>0; el('sp-play-label').textContent=playing?'Pause':state.position>0?'Resume':'Listen'; el('sp-stop').disabled=!playing && state.position===0; el('sp-play-state').textContent=playing?'Reading preview':state.position>0?'Paused':'Ready'; if(playing) {state.last=performance.now(); schedule();} }
  function resetPlayback() {state.position=0; playback(false); el('sp-progress').style.width='0%'; el('sp-time').textContent='0:00';}
  function schedule() {if(!frame) frame=requestAnimationFrame(tick);}
  function tick(time) {
    frame=0;
    if(state.playing) {
      const f=Math.max(0,Math.min(1,(time-state.rampStart)/150));
      state.appliedRate=state.fromRate+(state.rate-state.fromRate)*f*f*(3-2*f);
      state.position+=Math.min(100,time-state.last)/1000*state.appliedRate; state.last=time;
      el('sp-progress').style.width=Math.min(100,state.position/18*100)+'%'; el('sp-time').textContent='0:'+String(Math.floor(state.position)).padStart(2,'0');
      if(state.position>=18) {resetPlayback();el('sp-play-state').textContent='Finished';announce('Reading finished.');}
    }
    if(state.recording) {
      el('sp-record-time').textContent='0:'+String(Math.floor((time-state.recordStart)/1000)).padStart(2,'0');
      // ponytail: synthetic energy only in this design study; native UI must use microphone levels.
      const reduced=design.reduceMotion || matchMedia('(prefers-reduced-motion: reduce)').matches;
      root.querySelectorAll('.sp-wave span').forEach((bar,i)=>{bar.style.height=(reduced?8:4+20*Math.abs(Math.sin(time/190+i*.8))*Math.abs(Math.sin(time/670)))+'px';});
    }
    if(state.playing || state.recording) schedule();
  }
  function dismissPill() {root.dataset.dictation='idle';el('sp-pill').hidden=true;el('sp-trigger').hidden=false;reveal(el('sp-trigger'));}
  function cancel() {clearTimeout(finishTimer);clearTimeout(hideTimer);state.recording=false;state.processing=false;dismissPill();el('sp-target').focus();announce('Dictation cancelled. Nothing inserted.');}
  function start() {
    if(state.processing) return;
    clearTimeout(hideTimer);resetPlayback();
    const target=el('sp-target');state.start=target.selectionStart;state.end=target.selectionEnd;state.original=target.value;
    root.dataset.dictation='recording';state.recording=true;state.recordStart=performance.now();el('sp-pill').hidden=false;el('sp-trigger').hidden=true;el('sp-wave').hidden=false;el('sp-record-time').hidden=false;el('sp-finish').hidden=false;el('sp-cancel').hidden=false;el('sp-pill-state').textContent='Listening';el('sp-record-time').textContent='0:00';reveal(el('sp-pill'));target.focus();announce('Dictation preview started.');schedule();
  }
  function finish() {
    if(!state.recording) return;
    root.dataset.dictation='processing';state.recording=false;state.processing=true;el('sp-pill-state').textContent='Transcribing';el('sp-wave').hidden=true;el('sp-record-time').hidden=true;el('sp-finish').hidden=true;reveal(el('sp-pill-state'));
    finishTimer=setTimeout(()=>{
      state.processing=false;
      const target=el('sp-target');
      if(target.value!==state.original) {el('sp-pill-state').textContent='Field changed';announce('Example field changed. Cancel and try again.');return;}
      const sample=el('sp-format').value==='lists'?'- Buy apples\n- Pick up coffee\n- Get fresh flowers':'Buy apples, pick up coffee, and get fresh flowers.';
      target.setRangeText(sample,state.start,state.end,'end');target.focus();root.dataset.dictation='inserted';el('sp-pill-state').textContent='Inserted';el('sp-cancel').hidden=true;reveal(el('sp-pill-state'));announce('Sample text inserted into the example field.');hideTimer=setTimeout(dismissPill,900);
    },500);
  }
  function toggleDictation() {if(state.recording) finish();else start();}
  function settings(open) {el('sp-settings').hidden=!open;el('sp-reader').hidden=open;el('sp-settings-button').setAttribute('aria-expanded',String(open));reveal(open?el('sp-settings'):el('sp-reader'));(open?el('sp-back'):el('sp-settings-button')).focus();}
  el('sp-play').onclick=()=>{if(!el('sp-text').value.trim()){announce('Enter text first.');el('sp-text').focus();return;} if(state.recording || state.processing){announce('Finish dictation first.');return;} if(!state.playing && state.position===0 && !el('sp-remember').checked){el('sp-rate').value='1';rateChange();} playback(!state.playing);announce(state.playing?'Reading preview started.':'Reading paused.');};
  el('sp-stop').onclick=()=>{resetPlayback();announce('Playback stopped.');};el('sp-rate').oninput=rateChange;
  el('sp-trigger').onclick=toggleDictation;el('sp-finish').onclick=finish;el('sp-cancel').onclick=cancel;
  el('sp-settings-button').onclick=()=>settings(el('sp-settings').hidden);el('sp-back').onclick=()=>settings(false);
  el('sp-appearance').onchange=()=>{design.appearance=el('sp-appearance').value;renderDesign();};
  el('sp-shortcut').onchange=()=>{el('sp-key-label').textContent=el('sp-shortcut').selectedOptions[0].textContent;};
  root.addEventListener('keydown',event=>{
    if(event.key==='Escape') {if(!el('sp-settings').hidden)settings(false);else if(!el('sp-pill').hidden) {if(el('sp-pill-state').textContent==='Inserted')dismissPill();else cancel();} else resetPlayback();}
    const modifier=el('sp-shortcut').value==='ctrl-alt-space'?event.altKey&&!event.shiftKey:event.shiftKey&&!event.altKey;
    if(event.code==='Space'&&event.ctrlKey&&modifier&&!event.metaKey){event.preventDefault();if(!event.repeat)toggleDictation();}
  });
  renderDesign();
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:renderDesign});tweak.addSelect(design,'appearance',{label:'Appearance',options:['system','light','dark']});tweak.addToggle(design,'solid',{label:'Reduce transparency'});tweak.addToggle(design,'reduceMotion',{label:'Reduce waveform motion'});}
})();
</script>
